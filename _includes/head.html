<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
{% feed_meta %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
{% if page.url == "/" %}
{% assign a = site.author %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ a.name | jsonify }},
  "url": {{ site.url | jsonify }},
  "jobTitle": {{ a.job_title | jsonify }},
  "description": {{ site.description | jsonify }},
  "address": { "@type": "PostalAddress", "addressRegion": "Puerto Rico", "addressCountry": "US" }
  {%- assign same = "" | split: "" -%}
  {%- if a.linkedin != "" -%}{%- assign same = same | push: a.linkedin -%}{%- endif -%}
  {%- if a.x != "" -%}{%- assign same = same | push: a.x -%}{%- endif -%}
  {%- if same.size > 0 %},
  "sameAs": {{ same | jsonify }}
  {%- endif %}
}
</script>
{% endif %}
